<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CodeForge</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/animations.css">
<!-- CodeMirror 5 (核心 + 主题 + 多语言模式) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/jsx/jsx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<!-- marked (markdown 渲染) + DOMPurify (XSS 防护) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<!-- ===== 顶栏 ===== -->
<div class="topbar">
  <div class="window-controls">
    <span class="wc-close"></span>
    <span class="wc-min"></span>
    <span class="wc-max"></span>
  </div>
  <div class="topbar-title">CodeForge</div>
  <div class="theme-switch" id="theme-switch">
    <button class="theme-btn" data-theme="dark"  title="黑夜模式">🌙</button>
    <button class="theme-btn" data-theme="light" title="白天模式">☀️</button>
    <button class="theme-btn" data-theme="blue"  title="深蓝模式">🌊</button>
  </div>
</div>

<!-- ===== 主体 ===== -->
<div class="main">

  <!-- 左侧图标栏(用 inline SVG,跨平台一致) -->
  <div class="sidebar-icons">
    <div class="active" data-target=".sidebar" title="资源管理器">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
        <path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25V5.75A1.75 1.75 0 0014.25 4H8.81L7.43 2.617A1.75 1.75 0 006.19 2H1.75z"/>
      </svg>
    </div>
    <div title="搜索" data-target=".search-view">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>
      </svg>
    </div>
    <div title="源代码管理" data-target=".scm-view">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <circle cx="4" cy="3" r="1.6" fill="currentColor"/><circle cx="4" cy="13" r="1.6" fill="currentColor"/><circle cx="4" cy="8" r="1.6" fill="currentColor"/><path d="M9 4h2.5a2 2 0 012 2v6"/>
      </svg>
    </div>

    <div data-target=".right" title="Agent">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/>
        <rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>
      </svg>
    </div>

    <div id="ssh-icon" title="SSH 远程连接">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 4.5l-1 1.5 1 1.5M13.5 4.5l1 1.5-1 1.5M10 3L6 13"/>
      </svg>
    </div>

  </div>

  <!-- 左侧文件树 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span id="sidebar-header-title">资源管理器</span>
      <span>
        <span title="打开文件夹" data-action="open-folder-header">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 5a2 2 0 012-2h3l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/>
          </svg>
        </span>
        <span title="新建文件" data-action="create-file">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M8 3v10M3 8h10"/>
          </svg>
        </span>
        <span title="刷新" id="explorer-refresh" data-action="refresh-explorer">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M13 8a5 5 0 11-1.5-3.54L13 6"></path><path d="M13 2v4h-4"></path>
          </svg>
        </span>
      </span>
    </div>
    <div class="explorer">
      <div class="explorer-empty">
        <svg class="empty-icon" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 14a3 3 0 013-3h10l4 5h16a3 3 0 013 3v18a3 3 0 01-3 3H9a3 3 0 01-3-3V14z"/>
          <path d="M6 20h36"/>
        </svg>
        <div class="empty-title">您尚未打开任何文件夹</div>
        <div class="empty-actions">
          <button class="empty-btn" data-action="open-folder">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 5a2 2 0 012-2h3l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/>
            </svg>
            <span>打开文件夹</span>
          </button>
          <button class="empty-btn" data-action="create-file">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 1.5H4a1 1 0 00-1 1v11a1 1 0 001 1h8a1 1 0 001-1V5L9.5 1.5z"/>
              <path d="M9.5 1.5V4a1 1 0 001 1h2.5"/>
              <path d="M8 7.5v4M6 9.5h4"/>
            </svg>
            <span>新建文件</span>
          </button>
          <button class="empty-btn" data-action="create-folder">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 5a2 2 0 012-2h3l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/>
              <path d="M8 8v4M6 10h4"/>
            </svg>
            <span>新建文件夹</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 源代码管理(SCM) -->
    <div class="scm-view" id="scm-view" style="display:none;">
      <div class="scm-header">
        <span class="scm-branch" id="scm-branch">—</span>
        <span class="scm-ahead" id="scm-ahead"></span>
        <span class="scm-actions">
          <span id="scm-refresh" title="刷新">↻</span>
        </span>
      </div>
      <div class="scm-commit-box">
        <textarea id="scm-commit-msg" placeholder="消息 (Ctrl+Enter 提交)" rows="2"></textarea>
        <div class="scm-commit-actions">
          <button id="scm-push-btn" title="推送到远程">↑ 推送</button>
          <button id="scm-commit-btn" title="提交 (Ctrl+Enter)">✓ 提交</button>
        </div>
      </div>
      <div class="scm-changes" id="scm-changes"></div>
    </div>

    <!-- 全局搜索 -->
    <div class="search-view" id="search-view" style="display:none;">
      <div class="search-header">
        <input type="text" class="search-input" id="search-input" placeholder="搜索文件名或内容...">
      </div>
      <div class="search-meta" id="search-meta"></div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- 左侧文件树宽度拖拽手柄 -->
  <div class="resize-handle" data-target=".sidebar" data-direction="left" title="拖动调整宽度"></div>

  <!-- 中间:welcome / editor-host / diff viewer 三态切换 -->
  <div class="center">
    <div class="center-welcome" id="center-welcome">
      <div class="center-icon">&lt;/&gt;</div>
      <div class="center-title">CodeForge</div>
      <div class="center-sub">AI 驱动的网页编码工作台</div>
      <div class="shortcuts">
        <div class="shortcut-row"><span class="kbd">Ctrl+J</span> 切换 Agent 栏</div>
        <div class="shortcut-row"><span class="kbd">Ctrl+B</span> 切换资源管理器</div>
      </div>
    </div>
    <div class="editor-host" id="editor-host" style="display:none;"></div>
    <div class="diff-viewer" id="diff-viewer" style="display:none;">
      <div class="diff-tabs" id="diff-tabs"></div>
      <div class="diff-body"  id="diff-body"></div>
    </div>
  </div>

  <!-- 右侧栏宽度拖拽手柄 -->
  <div class="resize-handle" data-target=".right" data-direction="right" title="拖动调整宽度"></div>

  <!-- 右侧 AI + 终端 -->
  <div class="right">

    <!-- AI 助手 -->
    <div class="ai-panel">
      <div class="ai-header">
        <div class="ai-title">Agent</div>
        <div class="ai-actions">
          <div class="model-select">DeepSeek V4 Flash</div>
          <label class="toggle" title="计划模式:开启后,文件操作前必须先 plan">
            <input type="checkbox" id="toggle-plan" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Plan</span>
          </label>
          <label class="toggle" title="工具执行:关闭后,所有文件操作(create/edit/remove)需要手动确认">
            <input type="checkbox" id="toggle-auto" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">Tool</span>
          </label>
          <span class="icon-btn pending-badge hidden" id="pending-badge" title="有待确认操作">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
              <circle cx="8" cy="8" r="3"/>
            </svg>
          </span>
          <span class="icon-btn" id="chat-refresh" title="刷新模型列表">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M13 8a5 5 0 11-1.5-3.54L13 6"/><path d="M13 2v4h-4"/>
            </svg>
          </span>
          <span class="icon-btn" id="chat-clear" title="清空对话">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M3 4h10M6 4V2.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V4M5 4l.5 9a1 1 0 001 1h3a1 1 0 001-1L11 4"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="ai-messages" id="ai-messages">
        <div class="msg msg-assistant">
          <div class="msg-label">Assistant</div>
          <div class="msg-bubble">
            您好!我是 Agent。我可以帮助您编写、重构、解释和调试代码。请问您想做什么?
          </div>
        </div>
      </div>
      <!-- 批量 patch 操作栏(有 diff 时显示) -->
      <div class="patch-actions" id="patch-actions" style="display:none;">
        <span class="patch-actions-info" id="patch-actions-info"></span>
        <button class="patch-btn patch-btn-keep" id="patch-keep-all">✓ 全部保留</button>
        <button class="patch-btn patch-btn-discard" id="patch-discard-all">⟲ 全部撤销</button>
      </div>
      <div class="ai-input-wrap">
        <textarea class="ai-input" id="ai-input" placeholder="向 AI 提问... (Enter 发送,Shift+Enter 换行)"></textarea>
        <div class="ai-input-footer">
          <span id="ai-status">Enter 发送 · Shift+Enter 换行</span>
          <button class="send-btn" id="send-btn">
            <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M2 2l12 6L2 14l2.5-6L2 2z"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>

    <!-- 终端 -->
    <div class="terminal collapsed">
      <div class="term-tabs">
        <div class="term-tab-list" id="term-tab-list"></div>
        <div class="term-actions">
          <span id="term-new" title="新建">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M8 3v10M3 8h10"/>
            </svg>
          </span>
          <span id="term-clear" title="清屏">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
          </span>
          <span id="term-collapse" title="展开终端">
            <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6l5 5 5-5"/>
            </svg>
          </span>
        </div>
      </div>
      <div class="term-body" id="term-body">
        <div class="term-prompt-row">
          <span class="term-prompt">$&nbsp;</span>
          <input class="term-input" id="term-input" type="text" autocomplete="off"
                 spellcheck="false" placeholder="输入命令并按 Enter…">
        </div>
      </div>
    </div>

  </div>
</div>

<!-- SSH 连接 modal -->
<div class="modal-mask ssh-modal-mask" id="ssh-modal-mask" style="display:none;">
  <div class="modal-box ssh-modal-box">
    <div class="modal-title">SSH 远程连接</div>
    <div class="modal-form">
      <label>主机 (Host)
        <input type="text" id="ssh-host" placeholder="192.168.1.10 或 example.com" autocomplete="off">
      </label>
      <label>端口 (Port)
        <input type="number" id="ssh-port" value="22" min="1" max="65535">
      </label>
      <label>用户名 (User)
        <input type="text" id="ssh-user" placeholder="root" autocomplete="off">
      </label>
      <label>密码 (Password)
        <input type="password" id="ssh-password" placeholder="••••••" autocomplete="new-password">
      </label>
      <label class="ssh-optional">私钥路径 (可选,留空用密码)
        <input type="text" id="ssh-key" placeholder="C:\Users\xxx\.ssh\id_rsa" autocomplete="off">
      </label>
      <div class="ssh-modal-err" id="ssh-modal-err"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="ssh-cancel">取消</button>
      <button class="modal-btn primary" id="ssh-connect-btn">连接</button>
    </div>
  </div>
</div>

<!-- SSH 会话管理 modal -->
<div class="modal-mask ssh-list-mask" id="ssh-list-mask" style="display:none;">
  <div class="modal-box ssh-list-box">
    <div class="modal-title">SSH 会话</div>
    <div class="ssh-list-body" id="ssh-list-body"></div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="ssh-list-close">关闭</button>
    </div>
  </div>
</div>

<!-- 文件树右键菜单(单例,appendChild 到 body) -->
<div class="ctx-menu hidden" id="file-ctx-menu" role="menu"></div>

<script src="/static/app.js"></script>
</body>
</html>
